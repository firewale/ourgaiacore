services:
  redis:
    image: redis:7-alpine
    container_name: ourgaia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ourgaia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ourgaia
      POSTGRES_PASSWORD: ourgaia
      POSTGRES_DB: ourgaia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourgaia"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
